# Install with the matching root-owned helper at
# /usr/local/libexec/logimail/fail2ban-docker-user.sh. This action never creates
# a default DROP rule; it rejects only NEW TCP connections from a banned address
# to the jail's explicit mail ports in the Docker DOCKER-USER chain.
[Definition]
actionstart = /usr/local/libexec/logimail/fail2ban-docker-user.sh start <name> <protocol> <port>
actionstop = /usr/local/libexec/logimail/fail2ban-docker-user.sh stop <name> <protocol> <port>
actioncheck = /usr/local/libexec/logimail/fail2ban-docker-user.sh check <name> <protocol> <port>
actionban = /usr/local/libexec/logimail/fail2ban-docker-user.sh ban <name> <protocol> <port> <ip>
actionunban = /usr/local/libexec/logimail/fail2ban-docker-user.sh unban <name> <protocol> <port> <ip>

[Init]
name = postfix
protocol = tcp
port = 25,465,587
