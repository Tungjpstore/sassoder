name: GreenCloud VPS Deploy

on:
  push:
    branches:
      - main
    paths:
      - "infra/vps/**"
      - ".github/workflows/vps-deploy.yml"
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref or SHA to deploy
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: greencloud-vps-deploy
  cancel-in-progress: false

jobs:
  preflight:
    name: VPS config preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.inputs.git_ref || github.ref }}

      - name: Create placeholder env
        run: |
          cp infra/vps/.env.example /tmp/logivn-vps.env
          sed -i 's/^LOGIVN_INTERNAL_API_KEY=.*/LOGIVN_INTERNAL_API_KEY=ci-placeholder/' /tmp/logivn-vps.env
          sed -i 's/^REDIS_PASSWORD=.*/REDIS_PASSWORD=ci-placeholder/' /tmp/logivn-vps.env
          sed -i 's/^GF_SECURITY_ADMIN_PASSWORD=.*/GF_SECURITY_ADMIN_PASSWORD=ci-placeholder/' /tmp/logivn-vps.env

      - name: Validate Docker Compose
        run: docker compose --env-file /tmp/logivn-vps.env -f infra/vps/docker-compose.yml config >/dev/null

      - name: Validate shell scripts
        run: bash -n infra/vps/scripts/*.sh

  deploy:
    name: Deploy to GreenCloud VPS
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      DEPLOY_REF: ${{ github.event.inputs.git_ref || github.sha }}
      REPO_URL: https://github.com/Tungjpstore/sassoder.git
      APP_ROOT: /opt/logivn
    steps:
      - name: Skip until VPS secrets are configured
        if: ${{ env.VPS_HOST == '' || env.VPS_SSH_KEY == '' }}
        run: |
          echo "VPS_HOST and VPS_SSH_KEY are not configured; skipping deploy after preflight."
          echo "Configure repository secrets VPS_HOST, VPS_SSH_KEY, and optionally VPS_USER/VPS_PORT to enable auto-deploy."

      - name: Normalize SSH defaults
        if: ${{ env.VPS_HOST != '' && env.VPS_SSH_KEY != '' }}
        run: |
          echo "VPS_USER=${VPS_USER:-deploy}" >> "$GITHUB_ENV"
          echo "VPS_PORT=${VPS_PORT:-22}" >> "$GITHUB_ENV"

      - name: Prepare SSH
        if: ${{ env.VPS_HOST != '' && env.VPS_SSH_KEY != '' }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/logivn_vps_key
          chmod 600 ~/.ssh/logivn_vps_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Sync backup environment over SSH
        if: ${{ env.VPS_HOST != '' && env.VPS_SSH_KEY != '' }}
        env:
          BACKUP_R2_GATEWAY_URL: ${{ secrets.BACKUP_R2_GATEWAY_URL }}
          BACKUP_R2_GATEWAY_TOKEN: ${{ secrets.BACKUP_R2_GATEWAY_TOKEN }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_METADATA_SIGNING_KEY: ${{ secrets.BACKUP_METADATA_SIGNING_KEY }}
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_SUPABASE_URL: ${{ secrets.BACKUP_SUPABASE_URL }}
          BACKUP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BACKUP_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          patch_file="$(mktemp)"
          chmod 600 "$patch_file"

          write_env() {
            local key="$1"
            local value="$2"
            [ -n "$value" ] || return 0
            printf '%s=%q\n' "$key" "$value" >> "$patch_file"
          }

          write_env BACKUP_ENABLED true
          write_env BACKUP_ENVIRONMENT prod
          write_env BACKUP_STORAGE_ADAPTER worker
          write_env BACKUP_R2_GATEWAY_URL "$BACKUP_R2_GATEWAY_URL"
          write_env BACKUP_R2_GATEWAY_TOKEN "$BACKUP_R2_GATEWAY_TOKEN"
          write_env BACKUP_ENCRYPTION_KEY "$BACKUP_ENCRYPTION_KEY"
          write_env BACKUP_METADATA_SIGNING_KEY "$BACKUP_METADATA_SIGNING_KEY"
          write_env R2_BUCKET logivn-backups
          write_env BACKUP_R2_PREFIX logivn
          write_env DATABASE_URL "$BACKUP_DATABASE_URL"
          write_env NEXT_PUBLIC_SUPABASE_URL "$BACKUP_SUPABASE_URL"
          write_env SUPABASE_URL "$BACKUP_SUPABASE_URL"
          write_env SUPABASE_SERVICE_ROLE_KEY "$BACKUP_SUPABASE_SERVICE_ROLE_KEY"
          write_env DEV_TELEGRAM_ALERTS_ENABLED true

          remote_patch="/tmp/logivn-backup-env-${GITHUB_RUN_ID}.env"
          scp -i ~/.ssh/logivn_vps_key -P "$VPS_PORT" "$patch_file" "$VPS_USER@$VPS_HOST:$remote_patch"
          ssh -i ~/.ssh/logivn_vps_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "APP_ROOT='$APP_ROOT' PATCH_FILE='$remote_patch' bash -s" <<'REMOTE'
          set -euo pipefail

          ENV_FILE="$APP_ROOT/.env"

          if ! mkdir -p "$APP_ROOT" 2>/dev/null; then
            sudo -n mkdir -p "$APP_ROOT"
          fi

          if [ ! -w "$APP_ROOT" ]; then
            sudo -n chown -R "$(id -un):$(id -gn)" "$APP_ROOT"
          fi

          if [ -e "$ENV_FILE" ] && [ ! -w "$ENV_FILE" ]; then
            sudo -n chown "$(id -un):$(id -gn)" "$ENV_FILE"
          fi

          touch "$ENV_FILE"
          chmod 600 "$ENV_FILE"

          quote_env_value() {
            local value="$1"
            printf "'%s'" "$(printf '%s' "$value" | sed "s/'/'\\\\''/g")"
          }

          upsert_env() {
            local key="$1"
            local value="$2"
            local line tmp
            [ -n "$value" ] || return 0
            line="$key=$(quote_env_value "$value")"
            tmp="$(mktemp)"
            awk -v key="$key" -v line="$line" '
              BEGIN { done = 0 }
              $0 ~ "^[[:space:]]*(export[[:space:]]+)?" key "[[:space:]]*=" {
                if (!done) { print line; done = 1 }
                next
              }
              { print }
              END { if (!done) print line }
            ' "$ENV_FILE" > "$tmp"
            cat "$tmp" > "$ENV_FILE"
            rm -f "$tmp"
          }

          set -a
          # shellcheck disable=SC1090
          . "$PATCH_FILE"
          set +a

          for key in \
            BACKUP_ENABLED \
            BACKUP_ENVIRONMENT \
            BACKUP_STORAGE_ADAPTER \
            BACKUP_R2_GATEWAY_URL \
            BACKUP_R2_GATEWAY_TOKEN \
            BACKUP_ENCRYPTION_KEY \
            BACKUP_METADATA_SIGNING_KEY \
            R2_BUCKET \
            BACKUP_R2_PREFIX \
            DATABASE_URL \
            NEXT_PUBLIC_SUPABASE_URL \
            SUPABASE_URL \
            SUPABASE_SERVICE_ROLE_KEY \
            DEV_TELEGRAM_ALERTS_ENABLED; do
            upsert_env "$key" "${!key:-}"
          done

          rm -f "$PATCH_FILE"
          echo "[logivn-actions] Backup environment synced"
          REMOTE
          rm -f "$patch_file"

      - name: Deploy over SSH
        if: ${{ env.VPS_HOST != '' && env.VPS_SSH_KEY != '' }}
        run: |
          ssh -i ~/.ssh/logivn_vps_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "DEPLOY_REF='$DEPLOY_REF' REPO_URL='$REPO_URL' APP_ROOT='$APP_ROOT' bash -s" <<'REMOTE'
          set -euo pipefail

          if ! mkdir -p "$APP_ROOT" 2>/dev/null; then
            sudo -n mkdir -p "$APP_ROOT"
          fi

          if [ ! -w "$APP_ROOT" ]; then
            sudo -n chown -R "$(id -un):$(id -gn)" "$APP_ROOT"
          fi

          mkdir -p "$APP_ROOT/backups/worktrees"

          if [ -e "$APP_ROOT/app" ] && [ ! -d "$APP_ROOT/app/.git" ]; then
            backup_path="$APP_ROOT/backups/worktrees/app-non-git-$(date -u +%Y%m%dT%H%M%SZ)"
            mv "$APP_ROOT/app" "$backup_path"
            echo "Moved existing non-git app directory to $backup_path"
          fi

          if [ ! -d "$APP_ROOT/app/.git" ]; then
            git clone "$REPO_URL" "$APP_ROOT/app"
          fi

          cd "$APP_ROOT/app"
          if [ -n "$(git status --porcelain)" ]; then
            dirty_backup="$APP_ROOT/backups/worktrees/dirty-$(date -u +%Y%m%dT%H%M%SZ)"
            mkdir -p "$dirty_backup"
            git status --short > "$dirty_backup/status.txt"
            git diff > "$dirty_backup/worktree.diff" || true
            git ls-files --others --exclude-standard -z | tar --null -T - -czf "$dirty_backup/untracked.tgz" 2>/dev/null || true
            echo "Saved dirty worktree backup to $dirty_backup"
          fi

          git fetch origin --prune
          git checkout --force "$DEPLOY_REF"
          git reset --hard "$DEPLOY_REF"
          git clean -fd
          chmod +x infra/vps/scripts/*.sh

          APP_ROOT="$APP_ROOT" infra/vps/scripts/deploy.sh </dev/null
          REMOTE

      - name: Post-deploy validation over SSH
        if: ${{ env.VPS_HOST != '' && env.VPS_SSH_KEY != '' }}
        run: |
          ssh -i ~/.ssh/logivn_vps_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "APP_ROOT='$APP_ROOT' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$APP_ROOT/app"
          chmod +x infra/vps/scripts/*.sh

          echo "[logivn-actions] Installing cron"
          sudo -n APP_ROOT="$APP_ROOT" APP_REPO="$APP_ROOT/app" infra/vps/scripts/install-cron.sh </dev/null

          echo "[logivn-actions] Running local VPS validation"
          APP_ROOT="$APP_ROOT" infra/vps/scripts/validate.sh --local-only </dev/null

          echo "[logivn-actions] Running production readiness gate"
          APP_ROOT="$APP_ROOT" infra/vps/scripts/production-readiness.sh --local-only </dev/null
          REMOTE

      - name: Deployment summary
        if: ${{ env.VPS_HOST != '' && env.VPS_SSH_KEY != '' }}
        run: |
          {
            echo "### GreenCloud VPS deploy"
            echo ""
            echo "- Host: $VPS_HOST"
            echo "- Ref: $DEPLOY_REF"
            echo "- Rollback: rerun this workflow with a previous commit SHA in git_ref"
          } >> "$GITHUB_STEP_SUMMARY"
