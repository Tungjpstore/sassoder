global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: logivn-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway:3100
          - socket:3200
          - ai-service:3300
          - image-service:3400
          - worker:3500
          - telegram-bot:3600
          - platform-telegram-bot:3650

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter:9121

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
