name: logivn

x-app-env: &app-env
  LOGIVN_ENV: ${LOGIVN_ENV:-production}
  TZ: ${TZ:-Asia/Ho_Chi_Minh}
  NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://logivn.com}
  LOGIVN_API_PUBLIC_URL: ${LOGIVN_API_PUBLIC_URL:-https://api.logivn.com}
  LOGIVN_WS_PUBLIC_URL: ${LOGIVN_WS_PUBLIC_URL:-https://ws.logivn.com}
  LOGIVN_ALLOWED_ORIGINS: ${LOGIVN_ALLOWED_ORIGINS:-https://logivn.com,https://app.logivn.com}
  LOGIVN_INTERNAL_API_KEY: ${LOGIVN_INTERNAL_API_KEY}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
  DATABASE_URL: ${DATABASE_URL:-}
  AI_PROVIDER_FALLBACK_ORDER: ${AI_PROVIDER_FALLBACK_ORDER:-qwen,xai,openai,claude}
  AI_PROVIDER_TIMEOUT_MS: ${AI_PROVIDER_TIMEOUT_MS:-45000}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-5.2-mini}
  XAI_API_KEY: ${XAI_API_KEY:-}
  XAI_BASE_URL: ${XAI_BASE_URL:-https://api.x.ai/v1}
  XAI_CHAT_MODEL: ${XAI_CHAT_MODEL:-grok-4-mini}
  DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
  DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
  QWEN_CHAT_MODEL: ${QWEN_CHAT_MODEL:-qwen-plus}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com/v1}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
  ANTHROPIC_VERSION: ${ANTHROPIC_VERSION:-2023-06-01}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-1mb}

x-app-service: &app-service
  build:
    context: ./services
  restart: unless-stopped
  networks:
    - logivn-internal
  depends_on:
    redis:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - >
        redis-server
        --appendonly yes
        --save 900 1
        --save 300 10
        --save 60 10000
        --requirepass "$${REDIS_PASSWORD}"
        --maxmemory 1536mb
        --maxmemory-policy allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - redis-data:/data
    networks:
      - logivn-internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1800m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  gateway:
    <<: *app-service
    command: ["npm", "run", "start:gateway"]
    environment:
      <<: *app-env
      PORT: ${GATEWAY_PORT:-3100}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-3100}:${GATEWAY_PORT:-3100}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||3100)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    cpus: 0.6

  socket:
    <<: *app-service
    command: ["npm", "run", "start:socket"]
    environment:
      <<: *app-env
      PORT: ${SOCKET_PORT:-3200}
    ports:
      - "127.0.0.1:${SOCKET_PORT:-3200}:${SOCKET_PORT:-3200}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||3200)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 768m
    cpus: 0.8

  ai-service:
    <<: *app-service
    command: ["npm", "run", "start:ai"]
    environment:
      <<: *app-env
      PORT: ${AI_SERVICE_PORT:-3300}
    ports:
      - "127.0.0.1:${AI_SERVICE_PORT:-3300}:${AI_SERVICE_PORT:-3300}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||3300)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 768m
    cpus: 0.8

  image-service:
    <<: *app-service
    command: ["npm", "run", "start:image"]
    environment:
      <<: *app-env
      PORT: ${IMAGE_SERVICE_PORT:-3400}
    ports:
      - "127.0.0.1:${IMAGE_SERVICE_PORT:-3400}:${IMAGE_SERVICE_PORT:-3400}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||3400)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 1024m
    cpus: 0.8

  worker:
    <<: *app-service
    command: ["npm", "run", "start:worker"]
    environment:
      <<: *app-env
      PORT: ${WORKER_PORT:-3500}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    ports:
      - "127.0.0.1:${WORKER_PORT:-3500}:${WORKER_PORT:-3500}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||3500)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 1024m
    cpus: 1.0

  telegram-bot:
    <<: *app-service
    command: ["npm", "run", "start:telegram"]
    environment:
      <<: *app-env
      PORT: ${TELEGRAM_BOT_PORT:-3600}
    ports:
      - "127.0.0.1:${TELEGRAM_BOT_PORT:-3600}:${TELEGRAM_BOT_PORT:-3600}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||3600)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 384m
    cpus: 0.4

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - uptime-kuma-data:/app/data
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - logivn-internal
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  grafana:
    image: grafana/grafana-oss:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-logivn-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://monitor.logivn.com/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3002:3000"
    networks:
      - logivn-internal
    mem_limit: 768m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=4GB"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - logivn-internal
    mem_limit: 768m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - logivn-internal
    mem_limit: 128m
    cpus: 0.2

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - logivn-internal
    mem_limit: 256m
    cpus: 0.3

networks:
  logivn-internal:
    driver: bridge

volumes:
  redis-data:
  uptime-kuma-data:
  grafana-data:
  prometheus-data:
