  BULLMQ_PREFIX: ${BULLMQ_PREFIX:-logivn}
  QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY:-4}
  BULL_BOARD_ENABLED: ${BULL_BOARD_ENABLED:-false}
  BULL_BOARD_BASE_PATH: ${BULL_BOARD_BASE_PATH:-/queues/board}
  BULL_BOARD_USERNAME: ${BULL_BOARD_USERNAME:-}
  BULL_BOARD_PASSWORD: ${BULL_BOARD_PASSWORD:-}
  NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
  DATABASE_URL: ${DATABASE_URL:-}
  AI_PROVIDER_FALLBACK_ORDER: ${AI_PROVIDER_FALLBACK_ORDER:-qwen,xai,openai,claude}
  AI_PROVIDER_TIMEOUT_MS: ${AI_PROVIDER_TIMEOUT_MS:-45000}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
