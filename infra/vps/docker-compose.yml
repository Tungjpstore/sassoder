  DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
  DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
  QWEN_CHAT_MODEL: ${QWEN_CHAT_MODEL:-qwen-plus}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com/v1}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
  ANTHROPIC_VERSION: ${ANTHROPIC_VERSION:-2023-06-01}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
  TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
  TELEGRAM_CALLBACK_SECRET: ${TELEGRAM_CALLBACK_SECRET:-}
  TELEGRAM_CONNECT_TOKEN_SECRET: ${TELEGRAM_CONNECT_TOKEN_SECRET:-}
  TELEGRAM_CONNECT_TOKEN_TTL_SECONDS: ${TELEGRAM_CONNECT_TOKEN_TTL_SECONDS:-600}
  TELEGRAM_SESSION_SECRET: ${TELEGRAM_SESSION_SECRET:-}
  TELEGRAM_SESSION_TTL_SECONDS: ${TELEGRAM_SESSION_TTL_SECONDS:-300}
  TELEGRAM_TENANT_PICKER_MAX_OPTIONS: ${TELEGRAM_TENANT_PICKER_MAX_OPTIONS:-8}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
  TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
  TELEGRAM_WORKER_CONCURRENCY: ${TELEGRAM_WORKER_CONCURRENCY:-4}
  TELEGRAM_RATE_LIMIT_MAX: ${TELEGRAM_RATE_LIMIT_MAX:-24}
  TELEGRAM_RATE_LIMIT_DURATION_MS: ${TELEGRAM_RATE_LIMIT_DURATION_MS:-1000}
  TELEGRAM_CONNECT_RATE_LIMIT_MAX: ${TELEGRAM_CONNECT_RATE_LIMIT_MAX:-8}
  TELEGRAM_CONNECT_RATE_LIMIT_WINDOW_MS: ${TELEGRAM_CONNECT_RATE_LIMIT_WINDOW_MS:-60000}
  TELEGRAM_CALLBACK_RATE_LIMIT_MAX: ${TELEGRAM_CALLBACK_RATE_LIMIT_MAX:-30}
  TELEGRAM_CALLBACK_RATE_LIMIT_WINDOW_MS: ${TELEGRAM_CALLBACK_RATE_LIMIT_WINDOW_MS:-60000}
  TELEGRAM_AI_OPS_RATE_LIMIT_MAX: ${TELEGRAM_AI_OPS_RATE_LIMIT_MAX:-8}
  TELEGRAM_AI_OPS_RATE_LIMIT_WINDOW_MS: ${TELEGRAM_AI_OPS_RATE_LIMIT_WINDOW_MS:-60000}
  TELEGRAM_SEND_INTERVAL_MS: ${TELEGRAM_SEND_INTERVAL_MS:-75}
  TELEGRAM_MAX_RETRY_AFTER_MS: ${TELEGRAM_MAX_RETRY_AFTER_MS:-300000}
  TELEGRAM_MAX_RETRY_DELAY_MS: ${TELEGRAM_MAX_RETRY_DELAY_MS:-120000}
  TELEGRAM_AI_OPS_TIMEOUT_MS: ${TELEGRAM_AI_OPS_TIMEOUT_MS:-45000}
  PLATFORM_TELEGRAM_BOT_TOKEN: ${PLATFORM_TELEGRAM_BOT_TOKEN:-}
  PLATFORM_TELEGRAM_BOT_USERNAME: ${PLATFORM_TELEGRAM_BOT_USERNAME:-}
  PLATFORM_TELEGRAM_WEBHOOK_SECRET: ${PLATFORM_TELEGRAM_WEBHOOK_SECRET:-}
  PLATFORM_TELEGRAM_WEBHOOK_URL: ${PLATFORM_TELEGRAM_WEBHOOK_URL:-}
  PLATFORM_TELEGRAM_SESSION_SECRET: ${PLATFORM_TELEGRAM_SESSION_SECRET:-}
  PLATFORM_TELEGRAM_CONNECT_TOKEN_SECRET: ${PLATFORM_TELEGRAM_CONNECT_TOKEN_SECRET:-}
  PLATFORM_TELEGRAM_CONNECT_TOKEN_TTL_SECONDS: ${PLATFORM_TELEGRAM_CONNECT_TOKEN_TTL_SECONDS:-600}
  PLATFORM_TELEGRAM_BOOTSTRAP_TOKEN: ${PLATFORM_TELEGRAM_BOOTSTRAP_TOKEN:-}
  PLATFORM_TELEGRAM_ALLOWED_USER_IDS: ${PLATFORM_TELEGRAM_ALLOWED_USER_IDS:-}
  PLATFORM_TELEGRAM_WORKER_CONCURRENCY: ${PLATFORM_TELEGRAM_WORKER_CONCURRENCY:-2}
  PLATFORM_TELEGRAM_RATE_LIMIT_MAX: ${PLATFORM_TELEGRAM_RATE_LIMIT_MAX:-12}
  PLATFORM_TELEGRAM_RATE_LIMIT_DURATION_MS: ${PLATFORM_TELEGRAM_RATE_LIMIT_DURATION_MS:-1000}
  PLATFORM_TELEGRAM_CALLBACK_RATE_LIMIT_MAX: ${PLATFORM_TELEGRAM_CALLBACK_RATE_LIMIT_MAX:-20}
  PLATFORM_TELEGRAM_CALLBACK_RATE_LIMIT_WINDOW_MS: ${PLATFORM_TELEGRAM_CALLBACK_RATE_LIMIT_WINDOW_MS:-60000}
  PLATFORM_TELEGRAM_CONNECT_RATE_LIMIT_MAX: ${PLATFORM_TELEGRAM_CONNECT_RATE_LIMIT_MAX:-8}
  PLATFORM_TELEGRAM_CONNECT_RATE_LIMIT_WINDOW_MS: ${PLATFORM_TELEGRAM_CONNECT_RATE_LIMIT_WINDOW_MS:-60000}
  PLATFORM_TELEGRAM_SEND_INTERVAL_MS: ${PLATFORM_TELEGRAM_SEND_INTERVAL_MS:-100}
  PLATFORM_TELEGRAM_SESSION_TTL_SECONDS: ${PLATFORM_TELEGRAM_SESSION_TTL_SECONDS:-300}
  PLATFORM_GRAFANA_URL: ${PLATFORM_GRAFANA_URL:-https://monitor.logivn.com/grafana/}
  PLATFORM_BULL_BOARD_URL: ${PLATFORM_BULL_BOARD_URL:-https://monitor.logivn.com/queues/board/}
  PLATFORM_SOCKET_HEALTH_URL: ${PLATFORM_SOCKET_HEALTH_URL:-http://socket:3200/health}
  PLATFORM_AI_HEALTH_URL: ${PLATFORM_AI_HEALTH_URL:-http://ai-service:3300/health}
  PLATFORM_IMAGE_HEALTH_URL: ${PLATFORM_IMAGE_HEALTH_URL:-http://image-service:3400/health}
  PLATFORM_WORKER_HEALTH_URL: ${PLATFORM_WORKER_HEALTH_URL:-http://worker:3500/health}
  PLATFORM_TENANT_TELEGRAM_HEALTH_URL: ${PLATFORM_TENANT_TELEGRAM_HEALTH_URL:-http://telegram-bot:3600/health}
  OPERATIONAL_OUTBOX_RELAY_ENABLED: ${OPERATIONAL_OUTBOX_RELAY_ENABLED:-true}
  OPERATIONAL_OUTBOX_RELAY_INTERVAL_MS: ${OPERATIONAL_OUTBOX_RELAY_INTERVAL_MS:-5000}
  OPERATIONAL_OUTBOX_RELAY_BATCH_SIZE: ${OPERATIONAL_OUTBOX_RELAY_BATCH_SIZE:-25}
  OPERATIONAL_OUTBOX_RELAY_MAX_ATTEMPTS: ${OPERATIONAL_OUTBOX_RELAY_MAX_ATTEMPTS:-12}
  OPERATIONAL_OUTBOX_RELAY_LOCK_SECONDS: ${OPERATIONAL_OUTBOX_RELAY_LOCK_SECONDS:-120}
  OPERATIONAL_OUTBOX_RELAY_BACKOFF_MS: ${OPERATIONAL_OUTBOX_RELAY_BACKOFF_MS:-30000}
  OPERATIONAL_OUTBOX_RELAY_BACKOFF_MAX_MS: ${OPERATIONAL_OUTBOX_RELAY_BACKOFF_MAX_MS:-900000}
  ORDERS_SLA_SCANNER_ENABLED: ${ORDERS_SLA_SCANNER_ENABLED:-true}
  ORDERS_SLA_SCANNER_INTERVAL_MS: ${ORDERS_SLA_SCANNER_INTERVAL_MS:-60000}
  ORDERS_SLA_SCANNER_BATCH_SIZE: ${ORDERS_SLA_SCANNER_BATCH_SIZE:-80}
  ORDERS_SLA_WARNING_MINUTES: ${ORDERS_SLA_WARNING_MINUTES:-10}
  ORDERS_SLA_WARNING_REPEAT_MINUTES: ${ORDERS_SLA_WARNING_REPEAT_MINUTES:-15}
  PUSH_NOTIFICATION_WEBHOOK_URL: ${PUSH_NOTIFICATION_WEBHOOK_URL:-}
  EMAIL_NOTIFICATION_WEBHOOK_URL: ${EMAIL_NOTIFICATION_WEBHOOK_URL:-}
  ALERT_WEBHOOK_FORWARD_URL: ${ALERT_WEBHOOK_FORWARD_URL:-}
  ALERT_WEBHOOK_FORWARD_TOKEN: ${ALERT_WEBHOOK_FORWARD_TOKEN:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-1mb}

x-app-service: &app-service
  build:
    context: ./services
  restart: unless-stopped
  networks:
    - logivn-internal
  depends_on:
    redis:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  redis:
    image: redis:7.4.9-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - >
        redis-server /usr/local/etc/redis/redis.conf
        --requirepass "$${REDIS_PASSWORD}"
        --masterauth "$${REDIS_PASSWORD}"
        --maxmemory "$${REDIS_MAXMEMORY:-1gb}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-1gb}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    networks:
      - logivn-internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1400m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  gateway:
    <<: *app-service
    command: ["npm", "run", "start:gateway"]
    environment:
      <<: *app-env
      PORT: ${GATEWAY_PORT:-3100}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-3100}:${GATEWAY_PORT:-3100}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||3100)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    cpus: 0.6

  socket:
    <<: *app-service
    command: ["npm", "run", "start:socket"]
    environment:
      <<: *app-env
      PORT: ${SOCKET_PORT:-3200}
    ports:
      - "127.0.0.1:${SOCKET_PORT:-3200}:${SOCKET_PORT:-3200}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||3200)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 768m
    cpus: 0.8

  ai-service:
    <<: *app-service
    command: ["npm", "run", "start:ai"]
    environment:
      <<: *app-env
      PORT: ${AI_SERVICE_PORT:-3300}
    ports:
      - "127.0.0.1:${AI_SERVICE_PORT:-3300}:${AI_SERVICE_PORT:-3300}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||3300)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 768m
    cpus: 0.8

  image-service:
    <<: *app-service
    command: ["npm", "run", "start:image"]
    environment:
      <<: *app-env
      PORT: ${IMAGE_SERVICE_PORT:-3400}
    ports:
      - "127.0.0.1:${IMAGE_SERVICE_PORT:-3400}:${IMAGE_SERVICE_PORT:-3400}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||3400)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 1024m
    cpus: 0.8

  worker:
    <<: *app-service
    command: ["npm", "run", "start:worker"]
    environment:
      <<: *app-env
      PORT: ${WORKER_PORT:-3500}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    ports:
      - "127.0.0.1:${WORKER_PORT:-3500}:${WORKER_PORT:-3500}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||3500)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 1024m
    cpus: 1.0

  telegram-bot:
    <<: *app-service
    command: ["npm", "run", "start:telegram"]
    environment:
      <<: *app-env
      PORT: ${TELEGRAM_BOT_PORT:-3600}
    ports:
      - "127.0.0.1:${TELEGRAM_BOT_PORT:-3600}:${TELEGRAM_BOT_PORT:-3600}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||3600)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 384m
    cpus: 0.4

  platform-telegram-bot:
    <<: *app-service
    command: ["npm", "run", "start:platform-telegram"]
    environment:
      <<: *app-env
      PORT: ${PLATFORM_TELEGRAM_BOT_PORT:-3650}
    ports:
      - "127.0.0.1:${PLATFORM_TELEGRAM_BOT_PORT:-3650}:${PLATFORM_TELEGRAM_BOT_PORT:-3650}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||3650)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 384m
    cpus: 0.4

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - logivn-internal
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.2
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redisinsight:
    image: redis/redisinsight:3.4.2
    restart: unless-stopped
    volumes:
      - redisinsight-data:/data
    ports:
      - "127.0.0.1:5540:5540"
    networks:
      - logivn-internal
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 512m
    cpus: 0.4
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  uptime-kuma:
    image: louislam/uptime-kuma:1.23.17
    restart: unless-stopped
    volumes:
      - uptime-kuma-data:/app/data
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - logivn-internal
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  grafana:
    image: grafana/grafana-oss:13.0.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-logivn-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-https://monitor.logivn.com/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3002:3000"
    networks:
      - logivn-internal
    mem_limit: 768m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  prometheus:
    image: prom/prometheus:v3.11.3
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=4GB"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - logivn-internal
    mem_limit: 768m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  alertmanager:
    image: prom/alertmanager:v0.32.1
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--data.retention=120h"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - logivn-internal
    mem_limit: 128m
    cpus: 0.2
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.11.1
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - logivn-internal
    mem_limit: 128m
    cpus: 0.2

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - logivn-internal
    mem_limit: 256m
    cpus: 0.3

networks:
  logivn-internal:
    driver: bridge

volumes:
  redis-data:
  uptime-kuma-data:
  grafana-data:
  prometheus-data:
  alertmanager-data:
  redisinsight-data:
