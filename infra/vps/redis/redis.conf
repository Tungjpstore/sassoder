protected-mode yes
port 6379
# Docker Redis must listen on the private compose network. Do not publish 6379.
# For a non-Docker host install, change this to: bind 127.0.0.1
bind 0.0.0.0
# requirepass is injected by docker-compose from REDIS_PASSWORD.

appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes

save 900 1
save 300 10
save 60 10000

maxmemory 1gb
maxmemory-policy noeviction

tcp-keepalive 60
timeout 0
databases 1

slowlog-log-slower-than 10000
slowlog-max-len 256
latency-monitor-threshold 100

rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command SHUTDOWN ""
